
name: Build CoC Overlay APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project archive
        shell: bash
        run: |
          set -euxo pipefail
          test -f CoCOverlayMVP-cloud-build.zip
          unzip -t CoCOverlayMVP-cloud-build.zip

      - name: Extract Android project
        run: unzip -o CoCOverlayMVP-cloud-build.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "CoCOverlayMVP/settings.gradle.kts" ] || \
             [ -f "CoCOverlayMVP/settings.gradle" ]; then
            echo "project_dir=CoCOverlayMVP" >> "$GITHUB_OUTPUT"
          elif [ -f "settings.gradle.kts" ] || \
               [ -f "settings.gradle" ]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Gradle settings file not found."
            find . -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

      - name: Align Java and Kotlin JVM targets
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          gradle_file = (
              Path(os.environ["PROJECT_DIR"])
              / "app"
              / "build.gradle.kts"
          )

          if not gradle_file.is_file():
              raise SystemExit(f"Missing Gradle file: {gradle_file}")

          text = gradle_file.read_text(encoding="utf-8")

          java_options = (
              "    compileOptions {\n"
              "        sourceCompatibility = JavaVersion.VERSION_17\n"
              "        targetCompatibility = JavaVersion.VERSION_17\n"
              "    }\n\n"
          )

          if "compileOptions {" not in text:
              marker = "    kotlinOptions {"
              if marker not in text:
                  raise SystemExit(
                      "Cannot find kotlinOptions block."
                  )
              text = text.replace(
                  marker,
                  java_options + marker,
                  1
              )

          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              raise SystemExit("Java source target is not 17.")

          if "targetCompatibility = JavaVersion.VERSION_17" not in text:
              raise SystemExit("Java target compatibility is not 17.")

          if 'jvmTarget = "17"' not in text:
              raise SystemExit("Kotlin JVM target is not 17.")

          gradle_file.write_text(text, encoding="utf-8")

          print("Java and Kotlin JVM targets are both 17.")
          print(gradle_file.read_text(encoding="utf-8"))
          PY

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle project
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euxo pipefail
          gradle -p "$PROJECT_DIR" tasks --stacktrace

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euxo pipefail
          gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoCOverlayMVP-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
